<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria da All in one Agency</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2adad;
            margin: 0;
            padding: 20px;
        }

        h1 {

            text-align: center;
        }

        .gallery-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            text-align: center;
            background-color: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .gallery-item img {
            max-width: 100%;

            border-radius: 10px;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-10px);
            /* Flutuação ao passar o mouse */
        }

        .gallery-item:hover img {
            transform: scale(1.1);
            /* Zoom na imagem */
        }

        .description {
            margin-top: 10px;
            font-size: 16px;
            color: #333;
        }

        button {
                text-decoration: none !important;
                outline: none !important;
                box-shadow: none !important;
                background-color: black;
                resize: initial;
                text-decoration: dotted;
                color: #fff;
            }
        
    </style>
</head>

<body>

    <h1>Galeria da All in one Agency</h1>
    <button a href="All.in.one.Agency.html"></a>Home</button>
    <br><br><br><br>

    

    <div class="gallery-container">
        <div class="gallery-item">
            <img src="img 1.jpg" alt="Opção A">
            <p class="description">Fazemos o Melhor para si!</p>
        </div>
        <div class="gallery-item">
            <img src="img 9.jpg" alt="Opção B">
            <p class="description">Qualidade para suas memorias</p>
        </div>
        <div class="gallery-item">
            <img src="img 3.jpg" alt="Opção C">
            <p class="description">Precos imbativeis</p>
        </div>
        <div class="gallery-item">
            <img src="img 4.jpg" alt="Opção D">
            <p class="description">Integridade com o cliente</p>

        </div>
        <div class="gallery-item">
            <img src="img 5.jpg" alt="Opção E">
            <p class="description">Amor no nosso trabalho</p>
        </div>
        <div class="gallery-item">
            <img src="img 6.jpg" alt="Opção F">
            <p class="description">Felicidade no trabalgo</p>
        </div>
    </div>

    <script>
        // Exemplo simples de interação em JavaScript (opcional)
        document.querySelectorAll('.gallery-item').forEach(item => {
            item.addEventListener('click', () => {
                alert('Você clicou em uma opção!');
            });

        });
    </script>

</body>

</html>
